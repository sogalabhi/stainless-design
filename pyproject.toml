[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stainless-csm"
version = "0.1.0"
description = "Continuous Strength Method (Annex B) calculations for stainless steel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stainless-csm-api = "stainless_csm.api.main:run"

[project.gui-scripts]
stainless-csm = "stainless_csm.ui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
ui = ["PySide6-Essentials>=6.7", "matplotlib>=3.8"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "plotly>=5.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/stainless_csm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The code uses the symbols of the standard (en dash, subscripts, ε ...) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["stainless_csm"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "plotly.*"]
ignore_missing_imports = true
